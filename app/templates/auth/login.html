{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h1>Login</h1>
<form method="POST">
    {{ form.hidden_tag() }}

    <p>
        {{ form.user_id.label }}<br>
        {{ form.user_id() }}
    </p>

    <p>
        {{ form.password.label }}<br>
        {{ form.password() }}
    </p>

    {{ form.submit() }}
</form>
{% endblock %}
